        <header>
            <h1>TIME-TRAVELLER</h1>
            <p>Time travels with you.</p>

        <section class="locations">

            <div class="location home">
                <div class="icon">🏠</div>

                <input type="text" id="homeCity" list="cityList"
                       placeholder="Home" autocomplete="off">

                <div class="date-picker">
        <button type="button" class="date-display" id="homeDateDisplay"><span class="date-text">16 Sep 2026</span><span class="calendar-icon">📅</span></button>
        <input type="date" id="homeDate" class="native-date">
    </div>
            </div>

            <div class="arrow">→</div>

            <div class="location destination">
                <div class="icon">📍</div>

                <input type="text" id="destinationCity" list="cityList"
                       placeholder="Destination" autocomplete="off">

                <div class="date-picker">
        <button type="button" class="date-display" id="destinationDateDisplay"><span class="date-text">16 Sep 2026</span><span class="calendar-icon">📅</span></button>
        <input type="date" id="destinationDate" class="native-date">
    </div>
            </div>

        <section class="times">

            <div class="time-box">
                <div class="small-label">🏠 HOME</div>
                <div class="city-name" id="homeName">Amsterdam</div>
                <div class="time" id="homeTime">--:--</div>
            </div>

            <div class="difference" id="timeDifference">-- HOURS</div>

            <div class="time-box">
                <div class="small-label">📍 DESTINATION</div>
                <div class="city-name" id="destinationName">Tokyo</div>
                <div class="time" id="destinationTime">--:--</div>
            </div>

        </section>

        <section class="timeline">

            <div class="timeline-title">24 HOURS</div>

            <div class="timeline-row">
                <div class="timeline-label">
                    🏠 <span id="timelineHomeName">AMSTERDAM</span>
                </div>
                <div class="hours" id="homeHours"></div>
            </div>

            <div class="timeline-row">
                <div class="timeline-label">
                    📍 <span id="timelineDestinationName">TOKYO</span>
                </div>
                <div class="hours" id="destinationHours"></div>
            </div>

        </section>

        <section class="call">

            <div class="call-icon">📞</div>

            <div class="call-title">BEST TIME TO CALL HOME</div>

            <div class="call-times">
                <div>
                    <strong id="callDestinationTime">18:00</strong>
                    <span id="callDestinationName">Tokyo</span>
                </div>

                <div class="call-arrow">→</div>

                <div>
                    <strong id="callHomeTime">--:--</strong>
                    <span id="callHomeName">Amsterdam</span>
                </div>
            </div>

        </section>
