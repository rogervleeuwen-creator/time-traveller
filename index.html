<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Time-Traveller | Time Difference & Travel Time Zone Tool</title>
    <meta name="description" content="Compare time zones between home and your travel destination. Check the time difference for your travel date, view a 24-hour timeline, and find a good time to call home.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#f4f5f7">

    <link rel="canonical" href="https://itimetraveller.com/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Time-Traveller | Time Difference & Travel Time Zone Tool">
    <meta property="og:description" content="Compare home and destination time zones for your travel date with a simple 24-hour timeline.">
    <meta property="og:url" content="https://itimetraveller.com/">
    <meta property="og:site_name" content="Time-Traveller">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Time-Traveller | Time Difference & Travel Time Zone Tool">
    <meta name="twitter:description" content="Compare home and destination time zones for your travel date with a simple 24-hour timeline.">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>TIME-TRAVELLER</h1>
            <p>Time travels with you.</p>
        </header>

        <section class="locations">

            <div class="location home">
                <div class="icon">🏠</div>

                <input type="text" id="homeCity"
                       placeholder="Home" autocomplete="off">
                <div class="city-suggestions" id="homeSuggestions"></div>

                <div class="date-picker">
        <button type="button" class="date-display" id="homeDateDisplay"><span class="date-text">16 Sep 2026</span><span class="calendar-icon">📅</span></button>
        <input type="date" id="homeDate" class="native-date">
    </div>
            </div>

            <div class="arrow">→</div>

            <div class="location destination">
                <div class="icon">📍</div>

                <input type="text" id="destinationCity"
                       placeholder="Destination" autocomplete="off">
                <div class="city-suggestions" id="destinationSuggestions"></div>

                <div class="date-picker">
        <button type="button" class="date-display" id="destinationDateDisplay"><span class="date-text">16 Sep 2026</span><span class="calendar-icon">📅</span></button>
        <input type="date" id="destinationDate" class="native-date">
    </div>
            </div>

        </section>

        <section class="times">

            <div class="time-box">
                <div class="small-label">🏠 HOME</div>
                <div class="city-name" id="homeName">Amsterdam</div>
                <div class="time" id="homeTime">--:--</div>
            </div>

            <div class="difference" id="timeDifference">-- HOURS</div>

            <div class="time-box">
                <div class="small-label">📍 DESTINATION</div>
                <div class="city-name" id="destinationName">Tokyo</div>
                <div class="time" id="destinationTime">--:--</div>
            </div>

        </section>

        <section class="timeline">

            <div class="timeline-title">24 HOURS</div>

            <div class="timeline-row">
                <div class="timeline-label">
                    🏠 <span id="timelineHomeName">AMSTERDAM</span>
                </div>
                <div class="hours" id="homeHours"></div>
            </div>

            <div class="timeline-row">
                <div class="timeline-label">
                    📍 <span id="timelineDestinationName">TOKYO</span>
                </div>
                <div class="hours" id="destinationHours"></div>
            </div>

        </section>

        <section class="call">

            <div class="call-icon">📞</div>

            <div class="call-title">BEST TIME TO CALL HOME</div>

            <div class="call-times">
                <div>
                    <strong id="callDestinationTime">18:00</strong>
                    <span id="callDestinationName">Tokyo</span>
                </div>

                <div class="call-arrow">→</div>

                <div>
                    <strong id="callHomeTime">--:--</strong>
                    <span id="callHomeName">Amsterdam</span>
                </div>
            </div>

        </section>

        <div class="install-area">
            <button type="button" id="installButton" class="install-button">
                ＋ Add Time-Traveller to your device
            </button>
        </div>

        <footer>Time-Traveller</footer>

    </main>

    <script src="main.js"></script>
</body>
</html>
